name: publish

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the package to nuget.org'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.0.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Restore
        run: dotnet restore

      - name: Build
        run: >-
          dotnet build --configuration Release --no-restore
          -p:Version=${{ steps.gitversion.outputs.assemblySemVer }}
          -p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }}
          -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Test
        run: >-
          dotnet run --project tests/MEL.Spectre.Tests/MEL.Spectre.Tests.csproj
          --configuration Release --no-build
          -- --treenode-filter "/**"

      - name: Pack
        run: >-
          dotnet pack src/MEL.Spectre/MEL.Spectre.csproj
          --configuration Release --no-build
          -p:PackageVersion=${{ steps.gitversion.outputs.semVer }}
          --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg-${{ steps.gitversion.outputs.semVer }}
          path: ./artifacts/*.*nupkg

      - name: Push to nuget.org
        if: ${{ inputs.push }}
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate

      - name: Tag release
        if: ${{ inputs.push }}
        run: |
          tag="v${{ steps.gitversion.outputs.semVer }}"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            git tag "$tag"
            git push origin "$tag"
          fi

      - name: Create GitHub release
        if: ${{ inputs.push }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.gitversion.outputs.semVer }}"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes
